[versions]
# https://github.com/ZacSweers/Metro/releases
# The Gradle plugin, the runtime, and the metrox artifacts must share one
# version.ref: they are version-locked together. The compiler plugin tracks
# the Kotlin version, so a Kotlin upgrade requires a Metro upgrade in
# lockstep: check https://zacsweers.github.io/metro/latest/compatibility/
# against the `kotlin` entry in gradle/toml/kotlin.toml before bumping,
# and keep the pair out of comments so it cannot go stale here.
metro = "1.5.1"

# https://github.com/topjohnwu/libsu/releases
libsu = "6.0.0"

# https://github.com/square/leakcanary/releases
leakCanary = "2.14"

# https://github.com/G00fY2/version-compare/releases
versionCompare = "1.5.0"

# https://github.com/slackhq/compose-lints/releases
composeLintChecks = "1.6.1"

# https://github.com/mockk/mockk/releases
mockk = "1.14.11"

# https://github.com/robolectric/robolectric/releases
# https://robolectric.org/compatibility_table
robolectric = "4.17"

# The Jupiter-platform bridge that loads Robolectric (experimental, upstream dormant; kept as
# standing wiring, see the switches in the convention plugin):
# https://github.com/apter-tech/junit5-robolectric-extension
junit5RobolectricExtension = "0.9.0"

[libraries]
libsu = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }

leakCanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakCanary" }
leakCanary-plumber-android = { group = "com.squareup.leakcanary", name = "plumber-android", version.ref = "leakCanary" }

versionCompare = { group = "io.github.g00fy2", name = "versioncompare", version.ref = "versionCompare" }

composeLintChecks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLintChecks" }

# Unit-test doubles: only for verifying interactions, not for reaching the shell or property
# readers (those stay behind the IProperty / IShell interfaces and their default implementations).
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# Robolectric: fakes the Android framework on the JVM so per-entry detection unit tests run in CI.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# The Jupiter-platform bridge that loads Robolectric; experimental upstream, kept as standing
# wiring (the version key comment points at its repository).
junit5-robolectric-extension = { group = "tech.apter.junit5.jupiter", name = "robolectric-extension", version.ref = "junit5RobolectricExtension" }

# MetroX ViewModel integration: ViewModelGraph + MetroViewModelFactory
# (metrox-viewmodel) plus the Compose side (LocalMetroViewModelFactory,
# metroViewModel()). The Gradle plugin brings the metro runtime (annotations)
# in transitively, so only these two need declaring.
metrox-viewmodel = { group = "dev.zacsweers.metro", name = "metrox-viewmodel", version.ref = "metro" }
metrox-viewmodel-compose = { group = "dev.zacsweers.metro", name = "metrox-viewmodel-compose", version.ref = "metro" }

[bundles]
leakCanary = ["leakCanary-android"] # "leakCanary-plumber-android"
metrox-viewmodel = ["metrox-viewmodel", "metrox-viewmodel-compose"]

[plugins]
# Applying this plugin wires the Metro compiler plugin into every Kotlin
# compilation of the module and brings the metro runtime along; no KSP/KAPT
# involved (Metro generates IR directly). Only :app compiles Metro-annotated
# code, so only :app applies it.
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
